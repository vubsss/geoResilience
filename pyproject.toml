[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georesilience"
version = "0.1.0"
description = "Road network resilience analysis"
requires-python = ">=3.10"
dependencies = [
  "osmnx>=2,<3", "networkx>=3", "numpy", "scipy", "geopandas",
  "pyogrio", "shapely>=2", "networkit", "powerlaw", "rasterio",
  "PyYAML", "pydantic>=2", "matplotlib", "joblib", "psutil", "requests"
]

[project.scripts]
georesilience = "georesilience.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["network: tests requiring network access"]
