[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georesilience"
version = "0.1.0"
description = "Road network resilience analysis"
requires-python = ">=3.10"
dependencies = [
  "osmnx>=2,<3", "networkx>=3", "numpy>=2", "scipy", "geopandas", "pandas",
  "pyogrio", "shapely>=2", "rasterio", "pyproj",
  "pydantic>=2", "matplotlib", "joblib>=1.3", "psutil"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
georesilience = "georesilience.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
