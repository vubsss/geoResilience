input:
  source: graphml
  path: data/ticket06-demo/er.graphml
cleaning:
  consolidate: false
analysis:
  seed: 42
  n_jobs: 2
  max_memory_gb: 0.25
criticality:
  k_betweenness: 25
  k_detour: 25
  k_nodes: 25
  exact_info_max_nodes: 0
robustness:
  removal: [links, nodes]
  steps: 50
  f_max: 0.20
  adaptive: true
  node_attack_metric: degree
  failure_runs: 10
  efficiency_sources: 500
output:
  dir: results/ticket06-er
  figures: true
